<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222">
  <title>pi-DDR stage, cross-section through a side border</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <pattern id="ply" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#e3cc9f"/>
      <path d="M0,8 L8,0" stroke="#c9ab72" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="880" height="360" fill="#fff"/>
  <text x="440" y="28" text-anchor="middle" font-size="15" font-weight="bold">Section through the side border (scale 1 in = 80 px)</text>

  <!-- floor -->
  <line x1="60" y1="270" x2="720" y2="270" stroke="#222" stroke-width="2"/>
  <g stroke="#999">
    <line x1="80" y1="270" x2="68" y2="282"/><line x1="140" y1="270" x2="128" y2="282"/>
    <line x1="200" y1="270" x2="188" y2="282"/><line x1="260" y1="270" x2="248" y2="282"/>
    <line x1="320" y1="270" x2="308" y2="282"/><line x1="380" y1="270" x2="368" y2="282"/>
    <line x1="440" y1="270" x2="428" y2="282"/><line x1="500" y1="270" x2="488" y2="282"/>
    <line x1="560" y1="270" x2="548" y2="282"/><line x1="620" y1="270" x2="608" y2="282"/>
    <line x1="680" y1="270" x2="668" y2="282"/>
  </g>

  <!-- rug pad under the stage: 1/8 in -->
  <rect x="100" y="260" width="600" height="10" fill="#6b6b6b"/>
  <!-- base: 3/4 in plywood -->
  <rect x="100" y="200" width="600" height="60" fill="url(#ply)" stroke="#7a5c2e" stroke-width="1.5"/>
  <!-- border: 1/2 in plywood, 3 in wide, rounded outer top edge -->
  <path d="M100,200 L100,180 Q100,160 120,160 L340,160 L340,200 z" fill="url(#ply)" stroke="#7a5c2e" stroke-width="1.5"/>
  <!-- glue line -->
  <line x1="100" y1="200" x2="340" y2="200" stroke="#2e7d32" stroke-width="3"/>
  <!-- underlay: 1/8 in, and mat: 3/8 in -->
  <rect x="350" y="190" width="350" height="10" fill="#8a8a8a"/>
  <rect x="350" y="160" width="350" height="30" rx="4" fill="#5b6576"/>
  <!-- screw: #8 x 1 in, countersunk -->
  <path d="M212,160 L228,160 L222,168 L218,168 z" fill="#555"/>
  <line x1="220" y1="168" x2="220" y2="240" stroke="#555" stroke-width="4"/>
  <path d="M216,240 L224,240 L220,246 z" fill="#555"/>

  <!-- labels -->
  <g font-size="12.5">
    <line x1="110" y1="165" x2="96" y2="148" stroke="#444"/>
    <text x="20" y="126">1/4 in roundover</text>
    <text x="20" y="141">(both outer edges)</text>

    <line x1="220" y1="160" x2="220" y2="102" stroke="#444"/>
    <text x="160" y="80">#8 x 1 in flat-head screw,</text>
    <text x="160" y="95">every 6-8 in, into the base</text>

    <line x1="300" y1="172" x2="372" y2="92" stroke="#444"/>
    <text x="376" y="92">border: 1/2 in plywood, 3 in wide</text>

    <line x1="600" y1="170" x2="640" y2="136" stroke="#444"/>
    <text x="642" y="132">USB mat, 3/8 in</text>

    <line x1="640" y1="195" x2="730" y2="186" stroke="#444"/>
    <text x="734" y="190">non-slip underlay</text>
    <text x="734" y="205">1/8 in</text>

    <line x1="345" y1="186" x2="400" y2="304" stroke="#444"/>
    <text x="404" y="316">1/8 in clearance between border and mat</text>

    <line x1="260" y1="200" x2="200" y2="304" stroke="#2e7d32"/>
    <text x="110" y="316" fill="#2e7d32">wood glue over the joint</text>

    <line x1="600" y1="230" x2="734" y2="232" stroke="#444"/>
    <text x="734" y="236">base: 3/4 in plywood</text>

    <line x1="600" y1="265" x2="734" y2="262" stroke="#444"/>
    <text x="734" y="266">rug pad under stage</text>
  </g>

  <!-- height dimension -->
  <line x1="60" y1="160" x2="96" y2="160" stroke="#888" stroke-dasharray="3,3"/>
  <line x1="70" y1="160" x2="70" y2="270" stroke="#444" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="56" y="222" text-anchor="middle" transform="rotate(-90 56 222)" font-size="12">1-3/8 in</text>

  <text x="30" y="346" fill="#555" font-size="12">Mat top and border top are level. Thicker mat? Use thicker border stock (table in the plans). The border must never stand above the mat.</text>
</svg>
