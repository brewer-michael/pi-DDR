<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#222">
  <title>pi-DDR signal chain and where the delay goes</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#fff"/>
  <text x="500" y="28" text-anchor="middle" font-size="16" font-weight="bold">Signal chain, and where the delay goes</text>

  <!-- mats -->
  <g stroke="#555" fill="#5b6576">
    <rect x="20" y="80" width="120" height="46" rx="6"/>
    <rect x="20" y="160" width="120" height="46" rx="6"/>
  </g>
  <g fill="#fff" text-anchor="middle">
    <text x="80" y="100" font-weight="bold">Mat P1</text>
    <text x="80" y="116" font-size="11">USB port "P1"</text>
    <text x="80" y="180" font-weight="bold">Mat P2</text>
    <text x="80" y="196" font-size="11">USB port "P2"</text>
  </g>

  <!-- Pi -->
  <rect x="180" y="50" width="430" height="310" rx="10" fill="#f3f8ec" stroke="#5a7d3a" stroke-width="1.5"/>
  <text x="395" y="72" text-anchor="middle" font-weight="bold" fill="#3d5a24">Raspberry Pi 4 · Pi OS Lite · no desktop</text>
  <g fill="#fff" stroke="#888">
    <rect x="200" y="90" width="180" height="50" rx="4"/>
    <rect x="200" y="160" width="180" height="60" rx="4"/>
    <rect x="410" y="90" width="180" height="60" rx="4"/>
    <rect x="410" y="175" width="180" height="62" rx="4"/>
    <rect x="200" y="245" width="180" height="62" rx="4"/>
  </g>
  <g text-anchor="middle">
    <text x="290" y="110" font-weight="bold">kernel: usbhid + evdev</text>
    <text x="290" y="127" font-size="11">stamps each report's arrival</text>
    <text x="290" y="180" font-weight="bold">pad bridge (real-time)</text>
    <text x="290" y="196" font-size="11">mats → "pi-DDR P1" / "P2"</text>
    <text x="290" y="211" font-size="11">adds well under 1 ms</text>
    <text x="500" y="110" font-weight="bold">OutFox input thread</text>
    <text x="500" y="126" font-size="11">judges each step at its own</text>
    <text x="500" y="141" font-size="11">timestamp, not the frame</text>
    <text x="500" y="195" font-weight="bold">OutFox audio mixer</text>
    <text x="500" y="211" font-size="11">ALSA "hdmi:" · 48 kHz · stereo</text>
    <text x="500" y="226" font-size="11">music clock = samples played</text>
    <text x="290" y="265" font-weight="bold">OutFox renderer</text>
    <text x="290" y="281" font-size="11">vsync, steady 60 fps</text>
    <text x="290" y="296" font-size="11">arrows shifted by Visual Delay</text>
  </g>

  <!-- arrows inside and into the Pi -->
  <g stroke="#444" fill="none" stroke-width="1.5">
    <path d="M140,103 L200,112" marker-end="url(#arr)"/>
    <path d="M140,183 L200,122" marker-end="url(#arr)"/>
    <path d="M290,140 L290,160" marker-end="url(#arr)"/>
    <path d="M380,190 L396,190 L396,120 L410,120" marker-end="url(#arr)"/>
    <path d="M500,175 L500,150" marker-end="url(#arr)"/>
    <path d="M590,206 L650,206" marker-end="url(#arr)"/>
    <path d="M380,276 L630,276 L630,206"/>
  </g>
  <text x="506" y="166" font-size="10.5" fill="#555">clock</text>
  <text x="596" y="198" font-size="10.5" fill="#555">HDMI0</text>
  <text x="150" y="146" font-size="10.5" fill="#555" transform="rotate(-50 150 146)">USB</text>

  <!-- receiver, speakers, TV -->
  <rect x="650" y="120" width="175" height="140" rx="8" fill="#eef3fb" stroke="#3a5a8a" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="737" y="142" font-weight="bold" fill="#2a4470">AV receiver</text>
    <text x="737" y="162" font-size="11">stereo → 5.1 upmix</text>
    <text x="737" y="178" font-size="11">video passed straight through</text>
    <text x="737" y="194" font-size="11">auto lip-sync OFF</text>
    <text x="737" y="210" font-size="11">one fixed sound mode</text>
  </g>
  <g stroke="#555">
    <rect x="860" y="95" width="120" height="50" rx="6" fill="#fff"/>
    <rect x="860" y="215" width="120" height="50" rx="6" fill="#fff"/>
  </g>
  <g text-anchor="middle">
    <text x="920" y="116" font-weight="bold">5.1 speakers</text>
    <text x="920" y="132" font-size="11">2.9 ms per metre</text>
    <text x="920" y="236" font-weight="bold">TV</text>
    <text x="920" y="252" font-size="11">Game Mode</text>
  </g>
  <g stroke="#444" fill="none" stroke-width="1.5">
    <path d="M825,150 L860,125" marker-end="url(#arr)"/>
    <path d="M825,232 L860,240" marker-end="url(#arr)"/>
  </g>

  <!-- delay tags -->
  <g font-size="10.5">
    <rect x="20" y="222" width="140" height="20" rx="10" fill="#f6d7b0"/>
    <text x="90" y="236" text-anchor="middle">mat scan + USB poll</text>
    <rect x="20" y="248" width="140" height="20" rx="10" fill="#f3c1bc"/>
    <text x="90" y="262" text-anchor="middle">poll jitter: 0.5 vs 4 ms</text>
    <rect x="660" y="228" width="150" height="20" rx="10" fill="#f6d7b0"/>
    <text x="735" y="242" text-anchor="middle">upmix / DSP delay</text>
    <rect x="860" y="152" width="120" height="20" rx="10" fill="#f6d7b0"/>
    <text x="920" y="166" text-anchor="middle">air + DSP</text>
    <rect x="860" y="272" width="120" height="20" rx="10" fill="#c9daf2"/>
    <text x="920" y="286" text-anchor="middle">TV processing</text>
    <rect x="200" y="315" width="180" height="20" rx="10" fill="#c9daf2"/>
    <text x="290" y="329" text-anchor="middle">frame + vsync wait</text>
  </g>

  <!-- legend -->
  <g font-size="12.5">
    <rect x="20" y="392" width="18" height="18" rx="4" fill="#f6d7b0"/>
    <text x="48" y="406"><tspan font-weight="bold">Fixed delay on the input and audio paths.</tspan> One setting, the Global Offset, cancels all of it.</text>
    <text x="48" y="422">Calibrate it by stepping to what you hear.</text>
    <rect x="20" y="436" width="18" height="18" rx="4" fill="#c9daf2"/>
    <text x="48" y="450"><tspan font-weight="bold">Fixed delay on the video path</tspan>, compared with the audio. Visual Delay cancels it. Calibrate it by eye.</text>
    <rect x="20" y="468" width="18" height="18" rx="4" fill="#f3c1bc"/>
    <text x="48" y="482"><tspan font-weight="bold">Jitter</tspan> (delay that changes from step to step). No setting cancels it, so keep it small:</text>
    <text x="48" y="498">1 ms mat polling, a real-time bridge, one sample rate end to end, nothing wireless.</text>
    <text x="20" y="532" fill="#555" font-size="11.5">Not shown: the game's own audio buffer. OutFox asks ALSA how much audio is still queued and allows for it automatically.</text>
  </g>
</svg>
